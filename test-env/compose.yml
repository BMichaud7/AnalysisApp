version: "3.9"

services:

  # ── ActiveMQ Artemis broker ─────────────────────────────────────────────
  broker:
    image: apache/activemq-artemis:2.36.0
    container_name: sdr-broker
    environment:
      ARTEMIS_USER: sdr_ctrl
      ARTEMIS_PASSWORD: test_password
    ports:
      - "5672:5672"    # AMQP
      - "8161:8161"    # web console
    networks:
      - sdr-net
    healthcheck:
      test: ["CMD", "/var/lib/artemis-instance/bin/artemis", "check", "node", "--up"]
      interval: 5s
      timeout: 10s
      retries: 12

  # ── AnalysisApp ─────────────────────────────────────────────────────────
  analysis:
    image: localhost/sdr-analysis:dev
    container_name: sdr-analysis
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./config/analysis.xml:/etc/sdr-analysis/analysis.xml:ro
    environment:
      SDR_LOG_LEVEL: debug
    networks:
      - sdr-net

networks:
  sdr-net:
    driver: bridge
