name: RPM Package

on:
  push:
    branches: ["main/1.0"]
  workflow_dispatch:

jobs:
  rpm:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9

    steps:
      - name: Install build tools
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf makecache
          dnf install -y cmake ninja-build gcc-c++ git pkg-config rpm-build rpmdevtools
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh --repo gh-cli

      - name: Install app dependencies
        run: dnf install -y qpid-proton-cpp-devel tinyxml2-devel fftw-devel spdlog-devel fmt-devel libpqxx-devel || true

      - uses: actions/checkout@v4

      - name: Clone sibling dependencies
        run: |
          git clone --depth 1 --branch main/1.0 https://github.com/OpenRFStack/SdrSdk.git ../SdrSdk
          git clone --depth 1 --branch main/1.0 https://github.com/OpenRFStack/SdrTaskApi.git ../SdrTaskApi

      - name: Build
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          DESTDIR=$PWD/install cmake --install build

      - name: Package RPM
        run: |
          VERSION=$(grep -oP 'VERSION\s+\K\d+\.\d+\.\d+' CMakeLists.txt | head -1 || echo "2.5.0")
          BROOT="$HOME/rpmbuild/BUILDROOT/sdr-analysis-${VERSION}-1.x86_64"
          rpmdev-setuptree
          mkdir -p "$BROOT/usr/bin"
          cp install/usr/bin/sdr_analysis "$BROOT/usr/bin/"
          cp packaging/sdr-analysis.spec "$HOME/rpmbuild/SPECS/"
          rpmbuild -bb \
            --define "_topdir $HOME/rpmbuild" \
            --define "pkg_version ${VERSION}" \
            --buildroot "$BROOT" \
            "$HOME/rpmbuild/SPECS/sdr-analysis.spec"
          mkdir -p rpm_out
          find "$HOME/rpmbuild/RPMS" -name "*.rpm" -exec cp {} rpm_out/ \;
          ls -lh rpm_out/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest-main
          gh release view "$TAG" --repo ${{ github.repository }} 2>/dev/null || \
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --title "Latest build" \
              --notes "Rolling pre-release from main/1.0" \
              --prerelease
          gh release upload "$TAG" rpm_out/*.rpm \
            --repo ${{ github.repository }} \
            --clobber
