name: CI

on:
  push:
    branches: ["main/1.0"]
  pull_request:
    branches: ["main/1.0"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # Try both package names — Ubuntu 24.04 may ship either
          sudo apt-get install -y \
            cmake ninja-build pkg-config git \
            libtinyxml2-dev \
            libfmt-dev \
            libfftw3-dev \
            uuid-dev
          sudo apt-get install -y libqpid-proton-cpp12-dev 2>/dev/null || \
          sudo apt-get install -y libqpid-proton-dev qpid-proton-cpp-dev 2>/dev/null || \
          sudo apt-get install -y libqpid-proton-cpp-dev 2>/dev/null || true
          pkg-config --exists libqpid-proton-cpp && echo "proton found" || echo "proton not in pkg-config"

      - name: Clone SdrSdk and SdrTaskApi (sibling dependencies)
        run: |
          git clone --depth 1 --branch "main/1.0" \
            https://github.com/OpenRFStack/SdrSdk.git \
            ../SdrSdk
          git clone --depth 1 --branch "main/1.0" \
            https://github.com/OpenRFStack/SdrTaskApi.git \
            ../SdrTaskApi

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_QUIET=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -V --timeout 60
